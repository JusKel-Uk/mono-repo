services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: juskel-sql
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    volumes:
      - juskel-sql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  juskel-sql-data: