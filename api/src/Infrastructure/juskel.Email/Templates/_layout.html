<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>{{Subject}}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; }
      .body-padding { padding-left: 24px !important; padding-right: 24px !important; }
      .otp-code { font-size: 40px !important; letter-spacing: 4px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#111827;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">
    {{Preheader}}
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background-color:#ffffff;">

          <!-- Header -->
          <tr>
            <td style="padding:0;background-color:#11382F;">
              <img
                src="{{AssetsBaseUrl}}/header-banner.png"
                width="600"
                alt="JusKel"
                style="display:block;width:100%;max-width:600px;height:auto;border:0;"
              />
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td class="body-padding" style="padding:40px 48px 32px;">
              {{BodyContent}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:0 48px 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="border-top:1px solid #e5e7eb;padding-top:32px;text-align:center;">
                    <img
                      src="{{AssetsBaseUrl}}/logo-jk-black.png"
                      width="56"
                      height="56"
                      alt="JusKel"
                      style="display:block;margin:0 auto 20px;border:0;"
                    />
                    <p style="margin:0 0 16px;font-size:14px;line-height:1.6;color:#374151;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                      Helping businesses turn sustainability data into funding opportunities.
                    </p>
                    <p style="margin:0 0 16px;font-size:13px;line-height:1.6;color:#6b7280;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                      &copy; {{Year}} JusKel. All rights reserved.<br />
                      London, United Kingdom
                    </p>
                    <p style="margin:0 0 12px;font-size:13px;line-height:1.6;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                      <a href="{{WebsiteUrl}}" style="color:#2563eb;text-decoration:underline;">www.juskel.com</a>
                    </p>
                    <p style="margin:0 0 16px;font-size:13px;line-height:1.6;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                      <a href="{{TermsUrl}}" style="color:#2563eb;text-decoration:underline;">Terms of Use</a>
                      &nbsp;&nbsp;
                      <a href="{{PrivacyUrl}}" style="color:#2563eb;text-decoration:underline;">Privacy Policy</a>
                    </p>
                    <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                      Don&rsquo;t want these emails anymore? You can
                      <a href="{{UnsubscribeUrl}}" style="color:#2563eb;text-decoration:underline;">Unsubscribe</a>.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
