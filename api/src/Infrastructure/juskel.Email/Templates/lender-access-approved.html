<h1 style="margin:0 0 20px;font-size:28px;line-height:1.25;font-weight:700;color:#111827;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  {{Headline}}
</h1>
<p style="margin:0 0 28px;font-size:16px;line-height:1.6;color:#111827;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  {{IntroText}}
</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 28px;">
  <tr>
    <td style="background-color:#11382F;border-radius:8px;">
      <a href="{{CreateAccountUrl}}" style="display:inline-block;padding:14px 28px;font-size:16px;line-height:1.25;font-weight:600;color:#ffffff;text-decoration:none;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
        Create your account
      </a>
    </td>
  </tr>
</table>
<p style="margin:0 0 28px;font-size:14px;line-height:1.6;color:#6b7280;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  This link expires in <strong>{{ExpiryDays}} days</strong>. If the button does not work, copy this link into your browser:<br />
  <a href="{{CreateAccountUrl}}" style="color:#11382F;text-decoration:underline;font-weight:600;word-break:break-all;">{{CreateAccountUrl}}</a>
</p>
<p style="margin:0;font-size:16px;line-height:1.6;color:#111827;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  You can change what we email you about in
  <a href="{{UnsubscribeUrl}}" style="color:#11382F;text-decoration:underline;font-weight:600;">notification settings</a>.
</p>
